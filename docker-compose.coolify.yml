# NT Sistemas Web no Coolify (Docker Compose).
# Domínios: no Coolify, configure no serviço "app":
#   https://ntsistemasweb.com.br:8080,https://www.ntsistemasweb.com.br:8080

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: "NT Sistemas Web"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Defina APP_KEY}"
      APP_URL: "https://${SITE_DOMAIN:?Defina SITE_DOMAIN}"
      APP_TIMEZONE: America/Sao_Paulo
      APP_LOCALE: pt_BR
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}

      SITE_DOMAIN: "${SITE_DOMAIN:?Defina SITE_DOMAIN}"
      SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-contato@ntsistemasweb.com.br}
      SITE_NOTIFICATION_EMAIL: ${SITE_NOTIFICATION_EMAIL:-contato@ntsistemasweb.com.br}
      SITE_WHATSAPP: ${SITE_WHATSAPP:-5551995492191}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ntsistemas
      DB_USERNAME: ntsistemas
      DB_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD}"

      QUEUE_CONNECTION: sync
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "true"

      # Aviso de novo contato por e-mail. Sem SMTP, vai só para o log (o contato aparece no painel do mesmo jeito).
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-nao-responda@ntsistemasweb.com.br}
      MAIL_FROM_NAME: "NT Sistemas Web"
    volumes:
      - storage-app:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ntsistemas
      POSTGRES_USER: ntsistemas
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntsistemas -d ntsistemas"]
      interval: 10s
      retries: 5

volumes:
  storage-app:
  postgres-data:
